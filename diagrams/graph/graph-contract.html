<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The graph path — core/graph → Port → web/graph</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/graph-contract.css">
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · FlowDeck · graph path</p>
    <h1>The graph path — core/graph → Port → web/graph</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="graph-path-title graph-path-desc">
        <title id="graph-path-title">The graph path — core/graph → Port → web/graph</title>
        <desc id="graph-path-desc">The possible-paths graph path, reflecting the current code. core/graph builds PathGraph{ByName, Specs} at boot via New(fsys); the Port (the single contact) captures the *graph.PathGraph (never nil). The web handler handleWorkflowPage (GET /workflows/{name}) calls Graph.Of(name) to get a plain [][]string and passes it to web/graph.PathsToSVG, which renders the SVG into the page. web/graph is a pure renderer: it imports only flowdeck/core (not core/graph) and receives plain types, and the SVG is one-way (template.HTML). The executed path (ExecutedPathToSVG) is a separate runtime path fed by core.Step, out of scope here.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="11" cy="11" r="0.8" fill="rgba(232,230,225,0.10)"/>
          </pattern>
          <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#b8bcc4"/></marker>
          <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#ff9142"/></marker>
        </defs>

        <rect width="1000" height="690" fill="#0b0c0e"/>
        <rect width="1000" height="690" fill="url(#dots)"/>
        <rect x="0" y="156" width="1000" height="100" fill="rgba(255,145,66,0.025)"/>

        <!-- Band structure -->
        <line x1="0" y1="40" x2="1000" y2="40" stroke="rgba(232,230,225,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="156" x2="1000" y2="156" stroke="rgba(232,230,225,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="256" x2="1000" y2="256" stroke="rgba(232,230,225,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="356" x2="1000" y2="356" stroke="rgba(232,230,225,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="500" x2="1000" y2="500" stroke="rgba(232,230,225,0.12)" stroke-width="0.8"/>

        <!-- Band gutter labels -->
        <text x="20" y="84" class="lane-num">01</text>
        <text x="20" y="98" class="lane-label">CORE · GRAPH</text>
        <text x="20" y="112" class="lane-num">boot · AST</text>

        <text x="20" y="192" class="lane-num">02</text>
        <text x="20" y="206" class="lane-label">PORT</text>
        <text x="20" y="220" class="lane-num">single contact</text>

        <text x="20" y="292" class="lane-num">03</text>
        <text x="20" y="306" class="lane-label">WEB · HANDLER</text>
        <text x="20" y="320" class="lane-num">fetch · wire</text>

        <text x="20" y="414" class="lane-num">04</text>
        <text x="20" y="428" class="lane-label">WEB · GRAPH</text>
        <text x="20" y="442" class="lane-num">render · svg</text>

        <!-- Legend: flow -->
        <text x="580" y="74" class="legend-label">FLOW</text>
        <line x1="580" y1="88" x2="604" y2="88" stroke="#b8bcc4" marker-end="url(#arr-muted)"/><text x="612" y="92" class="legend-text">hand-off</text>
        <line x1="580" y1="104" x2="604" y2="104" stroke="#ff9142" stroke-width="1.2" marker-end="url(#arr-accent)"/><text x="612" y="108" class="legend-text">graph hand-off (focal)</text>

        <!-- Connectors first -->
        <!-- New(fsys) → PathGraph -->
        <line x1="300" y1="102" x2="358" y2="102" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <!-- PathGraph → Port -->
        <line x1="460" y1="134" x2="460" y2="170" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <text x="468" y="154" fill="#8f96a3" font-size="8" font-family="'Geist Mono', monospace">captured at NewPort · never nil</text>
        <!-- Port → handleWorkflowPage (focal: the graph hand-off) -->
        <line x1="460" y1="240" x2="460" y2="272" stroke="#ff9142" stroke-width="1.2" marker-end="url(#arr-accent)"/>
        <text x="468" y="260" fill="#ff9142" font-size="8" font-family="'Geist Mono', monospace">Of(name) → [][]string</text>
        <!-- handleWorkflowPage → PathsToSVG -->
        <line x1="460" y1="356" x2="460" y2="372" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <text x="468" y="366" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', monospace">paths [][]string</text>

        <!-- 01 · core/graph · New(fsys) -->
        <rect x="150" y="70" width="150" height="64" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <text x="225" y="93" class="node-title">New(fsys)</text>
        <text x="225" y="105" class="node-sub">walk · ParseFile · collect</text>
        <text x="225" y="117" class="node-tool">core/graph · boot</text>

        <!-- 01 · core/graph · PathGraph (the artifact) -->
        <rect x="360" y="70" width="200" height="64" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <text x="460" y="93" class="node-title">PathGraph</text>
        <text x="460" y="105" class="node-sub">{ ByName · Specs }</text>
        <text x="460" y="117" class="node-tool">artifact · read-only</text>

        <!-- 02 · Port (focal: the single contact) -->
        <rect x="360" y="176" width="200" height="64" rx="6" fill="rgba(255,145,66,0.10)" stroke="#ff9142" stroke-width="1.2"/>
        <text x="460" y="199" class="node-title">Port · single contact</text>
        <text x="460" y="211" class="node-sub">Graph *graph.PathGraph</text>
        <text x="460" y="223" class="node-sub">never nil · empty before Boot</text>

        <!-- 03 · web · handleWorkflowPage -->
        <rect x="360" y="276" width="200" height="80" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <text x="460" y="299" class="node-title">handleWorkflowPage</text>
        <text x="460" y="313" class="node-sub">GET /workflows/{name}</text>
        <text x="460" y="327" class="node-sub">p.Graph.Of(name)</text>

        <!-- 04 · web/graph · PathsToSVG (the renderer) -->
        <rect x="360" y="376" width="200" height="72" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <text x="460" y="399" class="node-title">PathsToSVG</text>
        <text x="460" y="415" class="node-sub">paths [][]string → SVG</text>
        <text x="460" y="429" class="node-tool">layout · measure · place · one-way</text>

        <!-- Out of scope: the executed path is a separate runtime path -->
        <rect x="580" y="376" width="380" height="72" rx="6" fill="none" stroke="rgba(143,150,163,0.50)" stroke-dasharray="4 3"/>
        <text x="600" y="399" fill="#8f96a3" font-size="9" font-weight="600" font-family="'Geist', sans-serif">out of scope here</text>
        <text x="600" y="415" fill="#8f96a3" font-size="8" font-family="'Geist Mono', monospace">ExecutedPathToSVG — the executed path</text>
        <text x="600" y="430" fill="#8f96a3" font-size="8" font-family="'Geist Mono', monospace">is fed by core.Step (runtime), not core/graph</text>

        <!-- Expectations: core/graph -->
        <rect x="40" y="508" width="455" height="150" rx="8" fill="rgba(232,230,225,0.03)" stroke="rgba(232,230,225,0.20)"/>
        <text x="60" y="530" fill="#e8e6e1" font-size="9" font-weight="600" font-family="'Geist', sans-serif">core/graph EXPECTS (from the embedded source)</text>
        <text x="60" y="556" fill="#b8bcc4" font-size="9" font-family="'Geist Mono', monospace">· RegisterWorkflow(ctx, F, WithWorkflowName("name"))</text>
        <text x="60" y="578" fill="#b8bcc4" font-size="9" font-family="'Geist Mono', monospace">· RunAsStep(ctx, fn, WithStepName("s")) — name = opt | arg[1]</text>
        <text x="60" y="600" fill="#b8bcc4" font-size="9" font-family="'Geist Mono', monospace">· parse error → boot fails loud (no partial map)</text>

        <!-- Expectations: web/graph -->
        <rect x="510" y="508" width="450" height="150" rx="8" fill="rgba(232,230,225,0.03)" stroke="rgba(232,230,225,0.20)"/>
        <text x="530" y="530" fill="#e8e6e1" font-size="9" font-weight="600" font-family="'Geist', sans-serif">web/graph EXPECTS (from the handler)</text>
        <text x="530" y="556" fill="#b8bcc4" font-size="9" font-family="'Geist Mono', monospace">· paths [][]string (plain) — empty = empty canvas</text>
        <text x="530" y="578" fill="#b8bcc4" font-size="9" font-family="'Geist Mono', monospace">· one-way — renders to template.HTML, no return data</text>
        <text x="530" y="600" fill="#b8bcc4" font-size="9" font-family="'Geist Mono', monospace">· imports only flowdeck/core — not core/graph</text>
      </svg>
    </div>

    <footer>FlowDeck · diagram-design · 2026-07-09</footer>
  </div>
</body>
</html>
