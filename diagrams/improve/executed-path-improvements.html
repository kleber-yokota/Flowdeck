  <div class="frame">

    <h1>Improve — Executed path (runtime groups · top-down · child id)</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 546" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ep-title ep-desc">
        <title id="ep-title">Improve — Executed path (runtime groups · top-down · child name + id)</title>
        <desc id="ep-desc">The improved executed path for /executions/{id}: the Postgres rows (workflow_status, operation_outputs, child rows by the parent filter) feed core/reads (Steps · Detail); a grouping pass in web/graph turns row times and names into runtime parallel groups (overlap of [started_at, completed_at]) and loop groups (repeated step name); the layout is transposed top-down with larger boxes (36 to 48 pixels, font 14 to 16 pixels, scale 1.25); groups render with a parallel outline, a loop arc and count, members beyond four collapse into one annotated box (full list in the title); and in the graph itself a child step renders as a box labeled with the child workflow NAME (read from the child's own workflow_status.name row) plus a live badge — not just "child"; the detail page additionally lists the child workflow ids (link to /executions/{id}). Facts: the seven DBOS statuses map to the five UI states, step rows are written on completion (no step-level running state), and the AST map is valid only when it matches the execution's application_version — the executed path is Postgres-only.</desc>

          <marker id="ep-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

          </marker>
          <linearGradient id="ep-panel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#191a1f"/>
            <stop offset="1" stop-color="#101114"/>
          </linearGradient>
        </defs>

        <rect width="100%" height="100%" fill="#0b0c0e"/>

        <line x1="560" y1="158" x2="586" y2="158" stroke="#b8bcc4" stroke-width="1.2" marker-end="url(#ep-arrow)"/>
        <line x1="750" y1="158" x2="776" y2="158" stroke="#b8bcc4" stroke-width="1.2" marker-end="url(#ep-arrow)"/>

        <!-- arrow labels -->

        <text x="383" y="150" fill="#8f96a3" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">steps</text>
        <text x="573" y="150" fill="#8f96a3" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">groups</text>
        <text x="763" y="150" fill="#8f96a3" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">svg</text>

        <!-- column 1: postgres rows -->

        <text x="32" y="116" fill="#e8e6e1" font-size="9" font-weight="600" font-family="'Geist', system-ui, sans-serif">POSTGRES 18 · DBOS</text>

        <text x="32" y="162" fill="#b8bcc4" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace">application_version</text>
        <text x="32" y="176" fill="#b8bcc4" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace">operation_outputs:</text>
        <text x="32" y="190" fill="#b8bcc4" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace">function_name · child_id ·</text>
        <text x="32" y="204" fill="#b8bcc4" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace">error · started_at · completed</text>

        <!-- column 2: core read -->

        <text x="20" y="354" fill="#8f96a3" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace">wait names: getResult · select · recv · sleep</text>

        <text x="340" y="326" fill="#8f96a3" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace">parallel) · kind: step · wait · child</text>
        <text x="340" y="340" fill="#8f96a3" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace">child rows: name · state · updated_at · attempts</text>

        <text x="660" y="284" fill="#8f96a3" font-size="7.5" font-family="'Geist Mono', ui-monospace, monospace">workflow_status.application_version — the AST</text>
