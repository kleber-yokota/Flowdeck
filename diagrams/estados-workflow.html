<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estados de um workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0b0c0e;   /* near-black */
      --color-ink:     #e8e6e1;   /* silver-white */
      --color-muted:   #b8bcc4;   /* steel */
      --color-soft:    #8f96a3;
      --color-accent:  #ff9142;   /* laranja */
      --color-link:    #7cc0ff;   /* azul claro */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }

    footer {
      margin-top: 1.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(232,230,225,0.14);
      font-family: var(--font-mono);
      font-size: 0.56rem;
      letter-spacing: 0.08em;
      color: var(--color-soft);
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Máquina de estados · FlowDeck</p>
    <h1>Estados de um workflow</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="estados-workflow-title estados-workflow-desc">
        <title id="estados-workflow-title">Estados de um workflow</title>
        <desc id="estados-workflow-desc">Ciclo de vida do workflow no DBOS: na fila, em execução com retry, e terminais de sucesso ou falha — as mesmas quatro cores dos badges da UI.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#b8bcc4"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#0b0c0e"/>

        <!-- transitions -->
        <line x1="106" y1="280" x2="160" y2="280" stroke="#b8bcc4" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="320" y1="280" x2="400" y2="280" stroke="#b8bcc4" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 472 240 V 184 Q 472 176 480 176 H 680" fill="none" stroke="#b8bcc4" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 488 320 V 376 Q 488 384 496 384 H 680" fill="none" stroke="#b8bcc4" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 528 240 V 212 Q 528 204 536 204 H 560 Q 568 204 568 212 V 239" fill="none" stroke="#b8bcc4" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="840" y1="176" x2="904" y2="176" stroke="#b8bcc4" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="840" y1="384" x2="904" y2="384" stroke="#b8bcc4" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- transition labels -->
        <rect x="115" y="260" width="36" height="12" rx="2" fill="#0b0c0e"/>
        <text x="133" y="269" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ENQUEUE</text>

        <rect x="336" y="260" width="48" height="12" rx="2" fill="#0b0c0e"/>
        <text x="360" y="269" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SCHEDULED</text>

        <rect x="556" y="156" width="48" height="12" rx="2" fill="#0b0c0e"/>
        <text x="580" y="165" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">COMPLETED</text>

        <rect x="552" y="364" width="72" height="12" rx="2" fill="#0b0c0e"/>
        <text x="588" y="373" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RETRY ESGOTADO</text>

        <rect x="526" y="184" width="44" height="12" rx="2" fill="#0b0c0e"/>
        <text x="548" y="193" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RETRY &le;3</text>

        <!-- start dot -->
        <circle cx="100" cy="280" r="6" fill="#e8e6e1"/>

        <!-- states -->
        <rect x="160" y="240" width="160" height="80" rx="8" fill="rgba(124,192,255,0.10)" stroke="#7cc0ff" stroke-width="1.2"/>
        <text x="240" y="278" fill="#e8e6e1" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">NA FILA</text>
        <text x="240" y="296" fill="#b8bcc4" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">dbos: enqueued</text>

        <rect x="400" y="240" width="160" height="80" rx="8" fill="rgba(255,145,66,0.10)" stroke="#ff9142" stroke-width="1.2"/>
        <text x="480" y="278" fill="#e8e6e1" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">EM EXECUCAO</text>
        <text x="480" y="296" fill="#b8bcc4" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">dbos: running</text>

        <rect x="680" y="140" width="160" height="72" rx="8" fill="rgba(70,209,154,0.10)" stroke="#46d19a" stroke-width="1.2"/>
        <text x="760" y="174" fill="#e8e6e1" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">SUCESSO</text>
        <text x="760" y="192" fill="#b8bcc4" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">dbos: success</text>

        <rect x="680" y="348" width="160" height="72" rx="8" fill="rgba(255,84,80,0.10)" stroke="#ff5450" stroke-width="1.2"/>
        <text x="760" y="382" fill="#e8e6e1" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">FALHA</text>
        <text x="760" y="400" fill="#b8bcc4" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">dbos: error</text>

        <!-- end dots -->
        <circle cx="912" cy="176" r="8" fill="#0b0c0e" stroke="#e8e6e1" stroke-width="1.2"/>
        <circle cx="912" cy="176" r="5" fill="#e8e6e1"/>
        <circle cx="912" cy="384" r="8" fill="#0b0c0e" stroke="#e8e6e1" stroke-width="1.2"/>
        <circle cx="912" cy="384" r="5" fill="#e8e6e1"/>

        <!-- legend strip -->
        <line x1="30" y1="496" x2="930" y2="496" stroke="rgba(232,230,225,0.10)" stroke-width="0.8"/>
        <text x="30" y="519" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGENDA</text>

        <circle cx="130" cy="516" r="4" fill="#7cc0ff"/>
        <text x="142" y="519" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">NA FILA</text>

        <circle cx="250" cy="516" r="4" fill="#ff9142"/>
        <text x="262" y="519" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">EM EXECUCAO</text>

        <circle cx="400" cy="516" r="4" fill="#46d19a"/>
        <text x="412" y="519" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">SUCESSO</text>

        <circle cx="530" cy="516" r="4" fill="#ff5450"/>
        <text x="542" y="519" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">FALHA</text>

        <text x="930" y="519" fill="#8f96a3" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">CORES = BADGES DA UI</text>
      </svg>
    </div>

    <footer>FlowDeck · diagram-design · 2026-10-23</footer>
  </div>
</body>
</html>
