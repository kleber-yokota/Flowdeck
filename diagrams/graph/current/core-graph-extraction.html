<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How core/graph extracts the paths map</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/core-graph-extraction.css">
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · FlowDeck</p>
    <h1>How core/graph extracts the paths map</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="core-graph-extraction-title core-graph-extraction-desc">
        <title id="core-graph-extraction-title">How core/graph extracts the paths map</title>
        <desc id="core-graph-extraction-desc">core/graph.New walks the embedded workflow source: each Go file is parsed and functions, DBOS registrations, constants and struct types are collected — a parse error fails boot loud. Per registration, the function body is walked to derive possible paths (RunAsStep adds, if branches fork, dedupe) and the spec (input struct fields, step defaults); registrations whose function is not in the source are skipped. The artifact is PathGraph{ByName, Specs}.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(232,230,225,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b8bcc4"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff9142"/></marker>
        </defs>

        <rect width="1000" height="920" fill="#0b0c0e"/>
        <rect width="1000" height="920" fill="url(#dots)" opacity="0.55"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <!-- embedded source → ParseFile·collect -->
        <line x1="500" y1="88" x2="500" y2="118" stroke="#b8bcc4" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- ParseFile·collect → parse error? -->
        <line x1="500" y1="168" x2="500" y2="190" stroke="#b8bcc4" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- parse error? YES → return error -->
        <line x1="600" y1="240" x2="716" y2="240" stroke="#b8bcc4" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- parse error? NO → func in source? -->
        <line x1="500" y1="288" x2="500" y2="326" stroke="#b8bcc4" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- func in source? YES → possiblePaths -->
        <line x1="500" y1="424" x2="500" y2="462" stroke="#b8bcc4" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- func in source? NO → skip (back to more regs?) -->
        <path d="M 600 376 H 660 V 688 H 602" fill="none" stroke="#b8bcc4" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- possiblePaths → inputs·stepSpecs -->
        <line x1="500" y1="512" x2="500" y2="550" stroke="#b8bcc4" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- inputs·stepSpecs → more regs? -->
        <line x1="500" y1="600" x2="500" y2="638" stroke="#b8bcc4" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- more regs? NO → PathGraph (artifact hand-off) -->
        <line x1="500" y1="736" x2="500" y2="774" stroke="#ff9142" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- more regs? YES → loop back to func in source? -->
        <path d="M 400 688 H 360 V 376 H 398" fill="none" stroke="#b8bcc4" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="644" y="220" width="24" height="12" rx="2" fill="#0b0c0e"/>
        <text x="656" y="229" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="508" y="300" width="24" height="12" rx="2" fill="#0b0c0e"/>
        <text x="520" y="309" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="508" y="436" width="32" height="12" rx="2" fill="#0b0c0e"/>
        <text x="524" y="445" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="612" y="362" width="56" height="12" rx="2" fill="#0b0c0e"/>
        <text x="640" y="371" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO · skip</text>

        <rect x="330" y="526" width="32" height="12" rx="2" fill="#0b0c0e"/>
        <text x="346" y="535" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="508" y="748" width="24" height="12" rx="2" fill="#0b0c0e"/>
        <text x="520" y="757" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <!-- Start: embedded source -->
        <rect x="420" y="40" width="160" height="48" rx="20" fill="rgba(232,230,225,0.03)" stroke="rgba(232,230,225,0.30)" stroke-width="1"/>
        <text x="500" y="68" fill="#e8e6e1" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">embedded source files</text>

        <!-- Rectangle: ParseFile · collect -->
        <rect x="420" y="120" width="160" height="48" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.35)" stroke-width="1"/>
        <text x="500" y="140" fill="#e8e6e1" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ParseFile · collect</text>
        <text x="500" y="155" fill="#b8bcc4" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">funcs · regs · const · type</text>

        <!-- Diamond: parse error? -->
        <polygon points="500,192 600,240 500,288 400,240" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.35)" stroke-width="1"/>
        <text x="500" y="244" fill="#e8e6e1" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">parse error?</text>

        <!-- End: return error -->
        <rect x="720" y="216" width="160" height="48" rx="20" fill="rgba(232,230,225,0.03)" stroke="rgba(232,230,225,0.30)" stroke-width="1"/>
        <text x="800" y="238" fill="#e8e6e1" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">return error</text>
        <text x="800" y="254" fill="#b8bcc4" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">boot fails loud</text>

        <!-- Diamond: func in source? -->
        <polygon points="500,328 600,376 500,424 400,376" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.35)" stroke-width="1"/>
        <text x="500" y="380" fill="#e8e6e1" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">func in source?</text>

        <!-- Rectangle: possiblePaths -->
        <rect x="420" y="464" width="160" height="48" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.35)" stroke-width="1"/>
        <text x="500" y="484" fill="#e8e6e1" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">possiblePaths</text>
        <text x="500" y="499" fill="#b8bcc4" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">RunAsStep · if · dedupe</text>

        <!-- Rectangle: inputs · stepSpecs -->
        <rect x="420" y="552" width="160" height="48" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.35)" stroke-width="1"/>
        <text x="500" y="572" fill="#e8e6e1" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">inputsOf · stepSpecs</text>
        <text x="500" y="587" fill="#b8bcc4" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">struct fields · defaults</text>

        <!-- Diamond: more regs? -->
        <polygon points="500,640 600,688 500,736 400,688" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.35)" stroke-width="1"/>
        <text x="500" y="692" fill="#e8e6e1" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">more regs?</text>

        <!-- End: PathGraph (focal artifact) -->
        <rect x="420" y="776" width="160" height="48" rx="20" fill="rgba(255,145,66,0.05)" stroke="#ff9142" stroke-width="1"/>
        <text x="500" y="796" fill="#e8e6e1" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PathGraph</text>
        <text x="500" y="812" fill="#b8bcc4" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ByName · Specs</text>

        <!-- Legend -->
        <line x1="40" y1="856" x2="960" y2="856" stroke="rgba(232,230,225,0.10)" stroke-width="0.8"/>
        <text x="40" y="872" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="40" y="884" width="24" height="12" rx="6" fill="rgba(232,230,225,0.03)" stroke="rgba(232,230,225,0.30)" stroke-width="1"/>
        <text x="72" y="893" fill="#b8bcc4" font-size="8.5" font-family="'Geist', sans-serif">Start / end (oval)</text>

        <rect x="220" y="884" width="24" height="12" rx="2" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.35)" stroke-width="1"/>
        <text x="252" y="893" fill="#b8bcc4" font-size="8.5" font-family="'Geist', sans-serif">Step (rectangle)</text>

        <polygon points="412,890 424,884 436,890 424,896" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.35)" stroke-width="1"/>
        <text x="448" y="893" fill="#b8bcc4" font-size="8.5" font-family="'Geist', sans-serif">Decision (diamond)</text>

        <line x1="604" y1="888" x2="632" y2="888" stroke="#ff9142" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="640" y="893" fill="#b8bcc4" font-size="8.5" font-family="'Geist', sans-serif">Artifact hand-off</text>

        <line x1="768" y1="888" x2="796" y2="888" stroke="#b8bcc4" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="804" y="893" fill="#b8bcc4" font-size="8.5" font-family="'Geist', sans-serif">Branch</text>
      </svg>
    </div>

    <footer>FlowDeck · diagram-design · 2026-07-09</footer>
  </div>
</body>
</html>
