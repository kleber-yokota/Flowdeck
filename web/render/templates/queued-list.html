{{range .}}
<div class="exec-row">
  <span class="wf-name">{{ .Name }}</span>
  <a class="wf-id" href="/executions/{{ .ID | urlquery }}">{{ .ID }}</a>
  <span class="ts">{{ .Started }}</span>
  <span class="status queued">queued</span>
  <span class="elapsed">{{ .Elapsed }}</span>
</div>
{{else}}
<p class="empty">no runs</p>
{{end}}
