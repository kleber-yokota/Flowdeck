{{if .Total}}
<div class="wall">
  {{- range .Items }}
  <a class="tile" href="/workflows/{{ .Name | urlquery }}">{{ .Name }}</a>
  {{- end }}
</div>
<div class="pager">
  {{- if .Prev }}<a href="/workflows?page={{ .Prev }}" hx-get="/workflows?page={{ .Prev }}" hx-target="#catalog">prev</a>{{ end }}
  <span class="info">{{ .Start }}–{{ .End }} de {{ .Total }}</span>
  {{- if .Next }}<a href="/workflows?page={{ .Next }}" hx-get="/workflows?page={{ .Next }}" hx-target="#catalog">next</a>{{ end }}
</div>
{{else}}
<p class="empty">No workflows registered</p>
{{end}}
