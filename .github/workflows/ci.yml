name: ci

# push only on main + pull_request on every branch: one push to a branch
# with an open PR must not fire two runs (push + pull_request).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: Generated registration list is up to date
        # workflows/zz_generated.go must match the workflow subpackages on
        # disk (the generator: cmd/workflowgen, run via go:generate).
        run: |
          go generate ./workflows
          git diff --exit-code workflows/zz_generated.go
      - name: Install structure tools
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          go install github.com/uudashr/gocognit/cmd/gocognit@latest
          go install github.com/nakabonne/nestif/cmd/nestif@latest
          go install github.com/sandstorm/dependency-analysis@latest
          go install github.com/mickamy/goimportmaps/cmd/goimportmaps@latest
      # The structure load lines: production functions may not exceed
      # cyclomatic 9 / cognitive 10, nesting may not exceed 5, and the
      # import contract (.goimportmaps.yaml) must hold. The thresholds live
      # in scripts/structure-gate.sh — raise one there and in code.md.
      - name: Structure gate (complexity, nesting, cycles, import contract)
        run: bash scripts/structure-gate.sh
      # The unit layer, separate from the race run: no env — the core
      # booted tests boot their own per-test cores (a fresh sqlite file
      # each), and the web · workflows booted tests skip (their env boot
      # is the e2e path).
      - name: Unit tests (no env — the booted tests skip)
        run: go test -count=1 ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The booted layer: every booted test boots its own core on a fresh
      # per-test SQLite file (t.TempDir) and shuts it down — no shared
      # database, so the binaries may run in parallel (no -p 1).
      - name: Booted suite (race, count=2, shuffled — catches registry/state leaks)
        run: go test -race -count=2 -shuffle=on ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: E2E against SQLite (the CI database)
        env:
          DBOS_APP_NAME: flowdeck_e2e
          DBOS_SYSTEM_DATABASE_URL: sqlite:/tmp/flowdeck-e2e.db
        # -p 1: one test binary at a time, so only one executor polls the
        # queue at a time (a job claimed by a process that has not
        # registered the workflow would fail).
        run: |
          rm -f /tmp/flowdeck-e2e.db
          go test -tags e2e -run TestE2E -p 1 ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...
