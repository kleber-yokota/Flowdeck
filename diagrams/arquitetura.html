<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowDeck — Arquitetura</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0b0c0e;   /* near-black */
      --color-ink:     #e8e6e1;   /* silver-white */
      --color-muted:   #b8bcc4;   /* steel */
      --color-soft:    #8f96a3;
      --color-accent:  #ff9142;   /* laranja */
      --color-link:    #7cc0ff;   /* azul claro */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }

    footer {
      margin-top: 1.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(232,230,225,0.14);
      font-family: var(--font-mono);
      font-size: 0.56rem;
      letter-spacing: 0.08em;
      color: var(--color-soft);
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitetura · FlowDeck</p>
    <h1>FlowDeck — Arquitetura</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arquitetura-title arquitetura-desc">
        <title id="arquitetura-title">FlowDeck — Arquitetura</title>
        <desc id="arquitetura-desc">Um unico servico Go na mesma maquina: a camada web (HTMX) faz boot do core DBOS e o core conversa com o Postgres 18 do docker-compose; a legenda define as quatro cores de status.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#b8bcc4"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#7cc0ff"/>
          </marker>
          <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e2e4e8"/>
            <stop offset="0.45" stop-color="#8d939e"/>
            <stop offset="1" stop-color="#b7bcc4"/>
          </linearGradient>
          <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#191a1f"/>
            <stop offset="1" stop-color="#101114"/>
          </linearGradient>
        </defs>

        <rect width="100%" height="100%" fill="#0b0c0e"/>

        <!-- zone: same machine -->
        <rect x="300" y="112" width="640" height="320" rx="8" fill="rgba(232,230,225,0.02)" stroke="rgba(232,230,225,0.10)" stroke-width="0.8"/>
        <rect x="308" y="116" width="112" height="12" rx="2" fill="#0b0c0e"/>
        <text x="364" y="125" fill="#8f96a3" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">1 MAQUINA · COMPOSE</text>

        <!-- arrows (before nodes) -->
        <line x1="260" y1="212" x2="380" y2="212" stroke="#7cc0ff" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="480" y1="248" x2="480" y2="304" stroke="#b8bcc4" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 580 340 H 632 Q 640 340 640 332 V 264 Q 640 256 648 256 H 700" fill="none" stroke="#b8bcc4" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- arrow labels -->
        <rect x="306" y="192" width="28" height="12" rx="2" fill="#0b0c0e"/>
        <text x="320" y="201" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTMX</text>

        <rect x="490" y="270" width="68" height="12" rx="2" fill="#0b0c0e"/>
        <text x="524" y="279" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LIST · ENQUEUE</text>

        <rect x="650" y="296" width="68" height="12" rx="2" fill="#0b0c0e"/>
        <text x="684" y="305" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SQL DURAVEL</text>

        <!-- Browser (external) -->
        <rect x="60" y="180" width="200" height="64" rx="6" fill="#0b0c0e"/>
        <rect x="60" y="180" width="200" height="64" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.35)" stroke-width="1"/>
        <rect x="68" y="186" width="28" height="12" rx="2" fill="transparent" stroke="rgba(232,230,225,0.30)" stroke-width="0.8"/>
        <text x="82" y="195" fill="#b8bcc4" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
        <text x="160" y="214" fill="#e8e6e1" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Browser</text>
        <text x="160" y="230" fill="#b8bcc4" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">chrome · htmx</text>

        <!-- FlowDeck service (focal container) -->
        <rect x="340" y="152" width="280" height="240" rx="8" fill="rgba(255,145,66,0.05)" stroke="#ff9142" stroke-width="1.2"/>
        <rect x="348" y="156" width="64" height="12" rx="2" fill="#0b0c0e"/>
        <text x="380" y="165" fill="#8f96a3" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">FLORDECK · GO</text>

        <!-- Web layer -->
        <rect x="380" y="176" width="200" height="72" rx="6" fill="#0b0c0e"/>
        <rect x="380" y="176" width="200" height="72" rx="6" fill="url(#panel)" stroke="url(#steel)" stroke-width="1"/>
        <rect x="388" y="182" width="28" height="12" rx="2" fill="transparent" stroke="rgba(184,188,196,0.40)" stroke-width="0.8"/>
        <text x="402" y="191" fill="#b8bcc4" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
        <text x="480" y="214" fill="#e8e6e1" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Web (HTMX)</text>
        <text x="480" y="230" fill="#b8bcc4" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">:8080 · htmx</text>

        <!-- DBOS core -->
        <rect x="380" y="304" width="200" height="72" rx="6" fill="#0b0c0e"/>
        <rect x="380" y="304" width="200" height="72" rx="6" fill="url(#panel)" stroke="url(#steel)" stroke-width="1"/>
        <rect x="388" y="310" width="32" height="12" rx="2" fill="transparent" stroke="rgba(184,188,196,0.40)" stroke-width="0.8"/>
        <text x="404" y="319" fill="#b8bcc4" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="480" y="342" fill="#e8e6e1" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">DBOS Core</text>
        <text x="480" y="358" fill="#b8bcc4" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">durable workflows</text>

        <!-- Postgres -->
        <rect x="700" y="220" width="200" height="72" rx="6" fill="#0b0c0e"/>
        <rect x="700" y="220" width="200" height="72" rx="6" fill="url(#panel)" stroke="#b8bcc4" stroke-width="1"/>
        <rect x="708" y="226" width="28" height="12" rx="2" fill="transparent" stroke="rgba(184,188,196,0.40)" stroke-width="0.8"/>
        <text x="722" y="235" fill="#b8bcc4" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SQL</text>
        <text x="800" y="258" fill="#e8e6e1" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Postgres 18</text>
        <text x="800" y="274" fill="#b8bcc4" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">compose · :5432</text>

        <!-- legend strip -->
        <line x1="30" y1="496" x2="930" y2="496" stroke="rgba(232,230,225,0.10)" stroke-width="0.8"/>
        <text x="30" y="519" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGENDA</text>

        <line x1="130" y1="516" x2="174" y2="516" stroke="#7cc0ff" stroke-width="1.2"/>
        <text x="182" y="519" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">HTMX</text>

        <line x1="250" y1="516" x2="294" y2="516" stroke="#b8bcc4" stroke-width="1.2"/>
        <text x="302" y="519" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">SQL</text>

        <circle cx="390" cy="516" r="4" fill="#7cc0ff"/>
        <text x="402" y="519" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">NA FILA</text>

        <circle cx="500" cy="516" r="4" fill="#ff9142"/>
        <text x="512" y="519" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">EM EXECUCAO</text>

        <circle cx="630" cy="516" r="4" fill="#46d19a"/>
        <text x="642" y="519" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">SUCESSO</text>

        <circle cx="750" cy="516" r="4" fill="#ff5450"/>
        <text x="762" y="519" fill="#b8bcc4" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">FALHA</text>
      </svg>
    </div>

    <footer>FlowDeck · diagram-design · 2026-10-23</footer>
  </div>
</body>
</html>
