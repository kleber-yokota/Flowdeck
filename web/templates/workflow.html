<!DOCTYPE html>
<html lang="en">
<head>
  {{template "head.html" .}}
</head>
<body>
  <main class="frame">
    <p class="eyebrow"><a class="back" href="/">Workflows</a></p>
    <h1>{{ .Name }}</h1>
    <button type="button"
            class="run"
            hx-post="/run/{{ .Name | urlquery }}"
            hx-target="#executions"
            hx-swap="afterbegin">
      Run
    </button>
    <!-- The runs of this workflow, newest first (phase 3, LIST): each row
         links to the execution detail; the badge polls GET /status every
         2s until the run reaches a terminal state. Each dispatch enqueues a
         run in the core (DBOS queue) and prepends a row (the ACK). -->
    <ul id="executions" class="executions">
{{range .Executions}}
{{template "execution.html" .}}
{{end}}
    </ul>
  </main>
</body>
</html>
