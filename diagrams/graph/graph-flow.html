<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graph subsystem — dependency and flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/graph-flow.css">
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · FlowDeck</p>
    <h1>Graph subsystem — dependency and flow</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 728 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="graph-flow-title graph-flow-desc">
        <title id="graph-flow-title">Graph subsystem — dependency and flow</title>
        <desc id="graph-flow-desc">The embedded workflows source is parsed by core/graph at boot into the PathGraph artifact (possible paths plus parameter specs); the core Port serves it (Of, Spec, Sanitize) and web/graph renders the possible-path and executed-path SVGs, with durable steps from Postgres feeding the executed path.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="11" cy="11" r="0.8" fill="rgba(232,230,225,0.10)"/>
          </pattern>
          <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#b8bcc4"/></marker>
          <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#ff9142"/></marker>
          <marker id="arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#7cc0ff"/></marker>
        </defs>

        <rect width="728" height="436" fill="#0b0c0e"/>
        <rect width="728" height="436" fill="url(#dots)"/>
        <rect x="0" y="116" width="728" height="80" fill="rgba(232,230,225,0.025)"/>
        <rect x="0" y="276" width="728" height="80" fill="rgba(232,230,225,0.025)"/>

        <!-- Header and lane structure -->
        <line x1="0" y1="36" x2="728" y2="36" stroke="rgba(232,230,225,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="116" x2="728" y2="116" stroke="rgba(232,230,225,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="196" x2="728" y2="196" stroke="rgba(232,230,225,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="276" x2="728" y2="276" stroke="rgba(232,230,225,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="356" x2="728" y2="356" stroke="rgba(232,230,225,0.12)" stroke-width="0.8"/>
        <line x1="140" y1="36" x2="140" y2="356" stroke="rgba(232,230,225,0.12)" stroke-width="0.8"/>

        <g aria-label="Pipeline steps">
          <rect x="180" y="6" width="32" height="16" rx="8" fill="rgba(232,230,225,0.12)"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">EMBED</text>
          <rect x="292" y="6" width="32" height="16" rx="8" fill="rgba(232,230,225,0.12)"/><text x="308" y="14" class="step-number">02</text><text x="308" y="29" class="step-label">PARSE</text>
          <rect x="404" y="6" width="32" height="16" rx="8" fill="rgba(232,230,225,0.12)"/><text x="420" y="14" class="step-number">03</text><text x="420" y="29" class="step-label">BUILD</text>
          <rect x="516" y="6" width="32" height="16" rx="8" fill="rgba(232,230,225,0.12)"/><text x="532" y="14" class="step-number">04</text><text x="532" y="29" class="step-label">SERVE</text>
          <rect x="628" y="6" width="32" height="16" rx="8" fill="rgba(255,145,66,0.22)"/><text x="644" y="14" class="step-number focal-text">05</text><text x="644" y="29" class="step-label focal-text">RENDER</text>
        </g>

        <g aria-label="Role lanes">
          <text x="70" y="72" class="lane-label">SOURCE</text><text x="70" y="84" class="lane-label">WORKFLOWS</text>
          <text x="70" y="152" class="lane-label">CORE</text><text x="70" y="164" class="lane-label">PARSE · SERVE</text>
          <text x="70" y="232" class="lane-label">WEB</text><text x="70" y="244" class="lane-label">PAGE · SVG</text>
          <text x="70" y="312" class="lane-label">DBOS</text><text x="70" y="324" class="lane-label">EXECUTION</text>
        </g>

        <!-- Connectors first. Cross-lane paths use r=8 orthogonal elbows. -->
        <!-- workflows/ → graph.New (embed → parse) -->
        <path d="M 246 76 H 300 Q 308 76 308 84 V 124" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <!-- graph.New → PathGraph -->
        <path d="M 358 156 H 368" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <!-- PathGraph → Port -->
        <path d="M 470 156 H 480" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <!-- Port → workflow page (the map serves the form + dispatch) -->
        <path d="M 532 188 V 202" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <!-- Port → web/graph (focal hand-off: the paths map) -->
        <path d="M 582 156 H 636 Q 644 156 644 164 V 204" fill="none" stroke="#ff9142" stroke-width="1.2" marker-end="url(#arr-accent)"/>
        <rect x="586" y="142" width="50" height="12" rx="2" fill="#0b0c0e"/>
        <text x="611" y="151" fill="#ff9142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PATHS MAP</text>
        <!-- workflow page → web/graph -->
        <path d="M 582 236 H 592" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <!-- Postgres → web/graph (durable steps → executed path) -->
        <path d="M 644 284 V 270" fill="none" stroke="#7cc0ff" marker-end="url(#arr-link)"/>

        <!-- SOURCE · workflows/ -->
        <rect x="146" y="44" width="100" height="64" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <rect x="150" y="48" width="18" height="10" rx="3" fill="rgba(232,230,225,0.12)"/><text x="159" y="53" class="role-text">SRC</text>
        <text x="196" y="67" class="node-title">workflows/</text><text x="196" y="79" class="node-sub">go:embed source</text><text x="196" y="91" class="node-tool">main.go embeds</text>
        <rect x="226" y="98" width="16" height="8" rx="3" fill="#9c6b50"/><text x="234" y="104" class="chip-text">FL</text>

        <!-- CORE · graph.New (parse) -->
        <rect x="258" y="124" width="100" height="64" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <rect x="262" y="128" width="18" height="10" rx="3" fill="rgba(232,230,225,0.12)"/><text x="271" y="133" class="role-text">CORE</text>
        <text x="308" y="147" class="node-title">graph.New</text><text x="308" y="159" class="node-sub">ParseFile · collect</text><text x="308" y="171" class="node-tool">go/parser · AST</text>
        <rect x="262" y="178" width="16" height="8" rx="3" fill="#9c6b50"/><text x="270" y="184" class="chip-text">FL</text>
        <rect x="338" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="346" y="184" class="chip-text">TB</text>

        <!-- CORE · PathGraph (artifact) -->
        <rect x="370" y="124" width="100" height="64" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <rect x="374" y="128" width="18" height="10" rx="3" fill="rgba(232,230,225,0.12)"/><text x="383" y="133" class="role-text">CORE</text>
        <text x="420" y="147" class="node-title">PathGraph</text><text x="420" y="159" class="node-sub">paths + specs</text><text x="420" y="171" class="node-tool">ByName · Specs</text>
        <rect x="374" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="382" y="184" class="chip-text">TB</text>
        <rect x="450" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="458" y="184" class="chip-text">TB</text>

        <!-- CORE · Port (serve) -->
        <rect x="482" y="124" width="100" height="64" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <rect x="486" y="128" width="18" height="10" rx="3" fill="rgba(232,230,225,0.12)"/><text x="495" y="133" class="role-text">CORE</text>
        <text x="532" y="147" class="node-title">Port</text><text x="532" y="159" class="node-sub">Of · Spec · Sanitize</text><text x="532" y="171" class="node-tool">core · dispatch</text>
        <rect x="486" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="494" y="184" class="chip-text">TB</text>
        <rect x="562" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="570" y="184" class="chip-text">TB</text>

        <!-- WEB · workflow page -->
        <rect x="482" y="204" width="100" height="64" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <rect x="486" y="208" width="18" height="10" rx="3" fill="rgba(232,230,225,0.12)"/><text x="495" y="213" class="role-text">WEB</text>
        <text x="532" y="227" class="node-title">workflow page</text><text x="532" y="239" class="node-sub">GET /workflows/{n}</text><text x="532" y="251" class="node-tool">web · HTMX</text>
        <rect x="486" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="494" y="264" class="chip-text">TB</text>
        <rect x="562" y="258" width="16" height="8" rx="3" fill="#6e6479"/><text x="570" y="264" class="chip-text">WB</text>

        <!-- WEB · web/graph (focal — receives the paths map) -->
        <rect x="594" y="204" width="100" height="64" rx="6" fill="rgba(255,145,66,0.12)" stroke="#ff9142" stroke-width="1.2"/>
        <rect x="598" y="208" width="18" height="10" rx="3" fill="rgba(255,145,66,0.22)"/><text x="607" y="213" class="role-text focal-text">WEB</text>
        <text x="644" y="227" class="node-title">web/graph</text><text x="644" y="239" class="node-sub">possible · executed</text><text x="644" y="251" class="node-tool">layout · SVG</text>
        <rect x="598" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="606" y="264" class="chip-text">TB</text>
        <rect x="674" y="258" width="16" height="8" rx="3" fill="#6e6479"/><text x="682" y="264" class="chip-text">WB</text>

        <!-- DBOS · Postgres (durable steps) -->
        <rect x="594" y="284" width="100" height="64" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <rect x="598" y="288" width="18" height="10" rx="3" fill="rgba(232,230,225,0.12)"/><text x="607" y="293" class="role-text">EXT</text>
        <text x="644" y="307" class="node-title">Postgres</text><text x="644" y="319" class="node-sub">durable steps</text><text x="644" y="331" class="node-tool">DBOS · Postgres 18</text>
        <rect x="674" y="338" width="16" height="8" rx="3" fill="#b8915a"/><text x="682" y="344" class="chip-text">TB</text>

        <!-- Legend: steps -->
        <text x="164" y="372" class="legend-label">STEPS</text>
        <rect x="180" y="364" width="24" height="12" rx="6" fill="rgba(232,230,225,0.12)"/><text x="192" y="372" class="step-number">01</text><text x="212" y="372" class="legend-text">Embed</text>
        <rect x="272" y="364" width="24" height="12" rx="6" fill="rgba(232,230,225,0.12)"/><text x="284" y="372" class="step-number">02</text><text x="304" y="372" class="legend-text">Parse</text>
        <rect x="360" y="364" width="24" height="12" rx="6" fill="rgba(232,230,225,0.12)"/><text x="372" y="372" class="step-number">03</text><text x="392" y="372" class="legend-text">Build</text>
        <rect x="468" y="364" width="24" height="12" rx="6" fill="rgba(232,230,225,0.12)"/><text x="480" y="372" class="step-number">04</text><text x="500" y="372" class="legend-text">Serve</text>
        <rect x="568" y="364" width="24" height="12" rx="6" fill="rgba(255,145,66,0.22)"/><text x="580" y="372" class="step-number focal-text">05</text><text x="600" y="372" class="legend-text focal-text">Render</text>

        <!-- Legend: data types -->
        <text x="164" y="393" class="legend-label">DATA TYPE</text>
        <rect x="180" y="385" width="16" height="8" rx="3" fill="#9c6b50"/><text x="188" y="391" class="chip-text">FL</text><text x="202" y="393" class="legend-text">Source file</text>
        <rect x="252" y="385" width="16" height="8" rx="3" fill="#b8915a"/><text x="260" y="391" class="chip-text">TB</text><text x="274" y="393" class="legend-text">Map · Steps</text>
        <rect x="332" y="385" width="16" height="8" rx="3" fill="#6e6479"/><text x="340" y="391" class="chip-text">WB</text><text x="354" y="393" class="legend-text">Page</text>
        <text x="404" y="393" class="legend-text">left chip = input · right chip = output</text>

        <!-- Legend: flow -->
        <text x="164" y="415" class="legend-label">FLOW</text>
        <line x1="180" y1="412" x2="204" y2="412" stroke="#b8bcc4" marker-end="url(#arr-muted)"/><text x="212" y="415" class="legend-text">Standard hand-off</text>
        <line x1="324" y1="412" x2="348" y2="412" stroke="#ff9142" stroke-width="1.2" marker-end="url(#arr-accent)"/><text x="356" y="415" class="legend-text">Focal hand-off</text>
        <line x1="460" y1="412" x2="484" y2="412" stroke="#7cc0ff" marker-end="url(#arr-link)"/><text x="492" y="415" class="legend-text">Durable steps</text>
      </svg>
    </div>

    <footer>FlowDeck · diagram-design · 2026-07-09</footer>
  </div>
</body>
</html>
