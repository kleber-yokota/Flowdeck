        <title id="sr-title">Improve — Resume a run (RewindWorkflow · ResumeWorkflow)</title>
        <desc id="sr-desc">Resume a run (improve): the guard now accepts failed and cancelled (anything else is a 400 ErrNotResumable). In the failed region (bug.md) the core reads the step rows, takes the cut (the first failed step) and calls dbos.RewindWorkflow(id, queue, cut) — the SDK ResumeWorkflow is a silent no-op on ERROR rows because its SQL excludes SUCCESS and ERROR, which is today's 400. In the cancelled region the core calls dbos.ResumeWorkflow(id, queue): the SDK SQL (status NOT IN (SUCCESS, ERROR)) re-enqueues the CANCELLED row and it resumes after the last completed step. Both ACKs return enqueued: the badge goes back to queued and the 2s poll resumes.</desc>
