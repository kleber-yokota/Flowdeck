{{- if .Terminal -}}
<span id="badge-{{ .WorkflowID | urlquery }}" class="badge {{ .Class }} terminal">{{ .Label }}</span>
{{- else -}}
<span id="badge-{{ .WorkflowID | urlquery }}" class="badge {{ .Class }}"
      data-workflow-id="{{ .WorkflowID }}"
      hx-get="/status/{{ .WorkflowID }}"
      hx-trigger="every 2s"
      hx-swap="outerHTML"
      hx-target="this">{{ .Label }}</span>
{{- end -}}
