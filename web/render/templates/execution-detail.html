<!DOCTYPE html>
<html lang="en">
<head>
  {{template "head.html" .}}
</head>
<body>
  <main class="frame">
    <p class="eyebrow"><a class="back" href="/workflows/{{ .Name | urlquery }}">{{ .Name }}</a></p>
    <h1 class="execution-id">{{ .ID }}</h1>
    <!-- Badge state: polls GET /status every 2s while the run is live; a
         terminal badge is static and the poll stops. The badge wrapper is
         the target of the cancel/resume ACKs. -->
    <div id="badge">{{template "badge.html" .Badge}}</div>
    <!-- The v6.3 split (the steps partial, shared with the 2s poll
         fragment): the meta row, the actions, the step log with the child
         blocks and the dashed tail, and the sticky executed path. -->
    {{template "steps.html" .Steps}}
  </main>
</body>
</html>
