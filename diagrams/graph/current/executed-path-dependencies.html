<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executed path — how the dependencies are generated</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/executed-path-dependencies.css">
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · FlowDeck · /executions/{id}</p>
    <h1>Executed path — how the dependencies are generated</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 640 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="epdep-title epdep-desc">
        <title id="epdep-title">Executed path — how the dependencies are generated</title>
        <desc id="epdep-desc">The executed-path graph is generated from the Postgres step rows (step_id asc): core.Steps maps each row to a Step whose state is failed when row.Error is set and success otherwise; ExecutedPathToSVG then wires the dependency (each step's child is the next step that ran), keeps only the first step as the single root, and the shared layout (measure, place, collect) emits the linear SVG, one rect and arrow per step, colored by the step state.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="11" cy="11" r="0.8" fill="rgba(232,230,225,0.10)"/>
          </pattern>
          <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#b8bcc4"/></marker>
        </defs>

        <rect width="640" height="840" fill="#0b0c0e"/>
        <rect width="640" height="840" fill="url(#dots)"/>

        <!-- Connectors first (straight lines; one r=8 elbow where the YES branch rejoins). -->
        <path d="M 320 92 V 140" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <path d="M 320 196 V 252" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <path d="M 428 296 H 460" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <path d="M 320 340 V 396" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <path d="M 540 324 V 512 Q 540 520 532 520 H 480" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <path d="M 320 452 V 492" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <path d="M 320 548 V 584" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <path d="M 320 640 V 672" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <path d="M 320 728 V 764" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>

        <!-- START · the durable input -->
        <ellipse cx="320" cy="64" rx="120" ry="28" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <text x="320" y="58" class="node-title">step rows</text>
        <text x="320" y="72" class="node-sub">Postgres · step_id asc</text>

        <!-- Process · core.Steps maps each row -->
        <rect x="180" y="140" width="280" height="56" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <text x="320" y="162" class="node-title">core.Steps — map each row</text>
        <text x="320" y="178" class="node-sub">Step{Name: row.StepName, State: …}</text>

        <!-- Decision · the row error is the failed-state source -->
        <polygon points="320,252 428,296 320,340 212,296" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <text x="320" y="300" class="diamond-text">row.Error != nil?</text>
        <rect x="436" y="280" width="20" height="12" rx="2" fill="#0b0c0e"/>
        <text x="446" y="289" class="branch-label">YES</text>
        <rect x="324" y="364" width="20" height="12" rx="2" fill="#0b0c0e"/>
        <text x="334" y="373" class="branch-label">NO</text>

        <!-- State · failed (the error path) -->
        <rect x="460" y="268" width="160" height="56" rx="6" fill="rgba(232,230,225,0.04)" stroke="#ff5450"/>
        <text x="540" y="292" class="node-title">state = failed</text>
        <text x="540" y="308" class="node-sub status-error">badge: failed · #ff5450</text>

        <!-- State · success (the default path) -->
        <rect x="240" y="396" width="160" height="56" rx="6" fill="rgba(232,230,225,0.04)" stroke="#46d19a"/>
        <text x="320" y="420" class="node-title">state = success</text>
        <text x="320" y="436" class="node-sub status-success">badge: success · #46d19a</text>

        <!-- Focal · the dependency is wired here -->
        <rect x="160" y="492" width="320" height="56" rx="6" fill="rgba(255,145,66,0.10)" stroke="#ff9142" stroke-width="1.2"/>
        <text x="320" y="514" class="node-title">ExecutedPathToSVG — wire the dependency</text>
        <text x="320" y="530" class="node-sub">nodes[i-1].Children = []pathNode{nodes[i]} · i: N-1 → 1</text>

        <!-- Process · single root (the chain is not N isolated steps) -->
        <rect x="200" y="584" width="240" height="56" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <text x="320" y="608" class="node-title">single root</text>
        <text x="320" y="624" class="node-sub">roots = []pathNode{nodes[0]} · first step</text>

        <!-- Process · shared layout of the graph package -->
        <rect x="170" y="672" width="300" height="56" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <text x="320" y="696" class="node-title">layout — measure → place → collect</text>
        <text x="320" y="712" class="node-sub">edges parent → child · scale 1.25×</text>

        <!-- END · the linear SVG -->
        <ellipse cx="320" cy="792" rx="130" ry="28" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <text x="320" y="786" class="node-title">executed path SVG</text>
        <text x="320" y="800" class="node-sub">rect + arrow per step · state-colored</text>
      </svg>
    </div>

    <footer>FlowDeck · diagram-design · 2026-07-09</footer>
  </div>
</body>
</html>
