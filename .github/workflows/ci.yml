name: ci

# push only on main + pull_request on every branch: one push to a branch
# with an open PR must not fire two runs (push + pull_request).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: Test (race, count=2, shuffled — catches registry/state leaks)
        run: go test -race -count=2 -shuffle=on ./...

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: flowdeck
          POSTGRES_PASSWORD: flowdeck
          POSTGRES_DB: flowdeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: E2E against Postgres 18
        env:
          DBOS_E2E_DATABASE_URL: postgres://flowdeck:flowdeck@localhost:5432/flowdeck?sslmode=disable
        run: go test -tags e2e -run TestE2E ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...
