<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executed path — flow and fetch</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/executed-path-flow.css">
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · FlowDeck · /executions/{id}</p>
    <h1>Executed path — flow and fetch</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 728 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="epflow-title epflow-desc">
        <title id="epflow-title">Executed path — flow and fetch</title>
        <desc id="epflow-desc">The execution detail page (GET /executions/{id}) and its 2s poll (GET /executions/{id}/steps) go through the web handlers into the core Port; the core reads the status row and the step rows from Postgres (step_id asc, row.Error mapped to failed) and hands the durable steps to web/graph.ExecutedPathToSVG, which renders the executed-path SVG into the steps fragment that HTMX swaps every 2s until the run is terminal.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="11" cy="11" r="0.8" fill="rgba(232,230,225,0.10)"/>
          </pattern>
          <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#b8bcc4"/></marker>
          <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#ff9142"/></marker>
          <marker id="arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#7cc0ff"/></marker>
        </defs>

        <rect width="728" height="436" fill="#0b0c0e"/>
        <rect width="728" height="436" fill="url(#dots)"/>
        <rect x="0" y="116" width="728" height="80" fill="rgba(232,230,225,0.025)"/>
        <rect x="0" y="276" width="728" height="80" fill="rgba(232,230,225,0.025)"/>

        <!-- Header and lane structure -->
        <line x1="0" y1="36" x2="728" y2="36" stroke="rgba(232,230,225,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="116" x2="728" y2="116" stroke="rgba(232,230,225,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="196" x2="728" y2="196" stroke="rgba(232,230,225,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="276" x2="728" y2="276" stroke="rgba(232,230,225,0.12)" stroke-width="0.8"/>
        <line x1="0" y1="356" x2="728" y2="356" stroke="rgba(232,230,225,0.12)" stroke-width="0.8"/>
        <line x1="140" y1="36" x2="140" y2="356" stroke="rgba(232,230,225,0.12)" stroke-width="0.8"/>

        <g aria-label="Pipeline steps">
          <rect x="180" y="6" width="32" height="16" rx="8" fill="rgba(232,230,225,0.12)"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">REQUEST</text>
          <rect x="292" y="6" width="32" height="16" rx="8" fill="rgba(232,230,225,0.12)"/><text x="308" y="14" class="step-number">02</text><text x="308" y="29" class="step-label">FETCH</text>
          <rect x="404" y="6" width="32" height="16" rx="8" fill="rgba(232,230,225,0.12)"/><text x="420" y="14" class="step-number">03</text><text x="420" y="29" class="step-label">READ</text>
          <rect x="516" y="6" width="32" height="16" rx="8" fill="rgba(232,230,225,0.12)"/><text x="532" y="14" class="step-number">04</text><text x="532" y="29" class="step-label">ROWS</text>
          <rect x="628" y="6" width="32" height="16" rx="8" fill="rgba(255,145,66,0.22)"/><text x="644" y="14" class="step-number focal-text">05</text><text x="644" y="29" class="step-label focal-text">RENDER</text>
        </g>

        <g aria-label="Role lanes">
          <text x="70" y="72" class="lane-label">BROWSER</text><text x="70" y="84" class="lane-label">HTMX · POLL</text>
          <text x="70" y="152" class="lane-label">WEB</text><text x="70" y="164" class="lane-label">HANDLERS</text>
          <text x="70" y="232" class="lane-label">CORE</text><text x="70" y="244" class="lane-label">PORT</text>
          <text x="70" y="312" class="lane-label">POSTGRES</text><text x="70" y="324" class="lane-label">DBOS</text>
        </g>

        <!-- Connectors first. Cross-lane paths use r=8 orthogonal elbows. -->
        <!-- Browser → handlers (the 2s poll, HTTP) -->
        <path d="M 246 76 H 300 Q 308 76 308 84 V 124" fill="none" stroke="#7cc0ff" marker-end="url(#arr-link)"/>
        <!-- Handlers → Port (the fetch through the single contact) -->
        <path d="M 358 156 H 412 Q 420 156 420 164 V 204" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <!-- Port → Postgres (the read: ListWorkflows + GetWorkflowSteps) -->
        <path d="M 470 236 H 636 Q 644 236 644 244 V 284" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <!-- Postgres → Port (the rows come back: step_id asc, the Error column) -->
        <path d="M 594 316 H 428 Q 420 316 420 308 V 268" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <!-- Port → renderer (focal hand-off: the durable steps) -->
        <path d="M 470 220 H 636 Q 644 220 644 212 V 188" fill="none" stroke="#ff9142" stroke-width="1.2" marker-end="url(#arr-accent)"/>
        <rect x="504" y="200" width="96" height="12" rx="2" fill="#0b0c0e"/>
        <text x="552" y="209" fill="#ff9142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DURABLE STEPS</text>
        <!-- Renderer → steps fragment (the SVG swap, every 2s until terminal) -->
        <path d="M 644 124 V 108" fill="none" stroke="#7cc0ff" marker-end="url(#arr-link)"/>

        <!-- BROWSER · execution page (the request: page load + 2s poll) -->
        <rect x="146" y="44" width="100" height="64" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <rect x="150" y="48" width="18" height="10" rx="3" fill="rgba(232,230,225,0.12)"/><text x="159" y="53" class="role-text">HTMX</text>
        <text x="196" y="67" class="node-title">execution page</text><text x="196" y="79" class="node-sub">GET /executions/{id}</text><text x="196" y="91" class="node-tool">HTMX · 2s poll</text>
        <rect x="150" y="98" width="16" height="8" rx="3" fill="#4a7c59"/><text x="158" y="104" class="chip-text">FL</text>
        <rect x="226" y="98" width="16" height="8" rx="3" fill="#6e6479"/><text x="234" y="104" class="chip-text">WB</text>

        <!-- WEB · handlers (detail + the steps partial) -->
        <rect x="258" y="124" width="100" height="64" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <rect x="262" y="128" width="18" height="10" rx="3" fill="rgba(232,230,225,0.12)"/><text x="271" y="133" class="role-text">WEB</text>
        <text x="308" y="147" class="node-title">handlers</text><text x="308" y="159" class="node-sub">detail · steps · status</text><text x="308" y="171" class="node-tool">web · HTMX</text>
        <rect x="262" y="178" width="16" height="8" rx="3" fill="#6e6479"/><text x="270" y="184" class="chip-text">WB</text>
        <rect x="338" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="346" y="184" class="chip-text">TB</text>

        <!-- CORE · Steps · Detail · Status (the Port read) -->
        <rect x="370" y="204" width="100" height="64" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <rect x="374" y="208" width="18" height="10" rx="3" fill="rgba(232,230,225,0.12)"/><text x="383" y="213" class="role-text">CORE</text>
        <text x="420" y="227" class="node-title">Steps · Detail</text><text x="420" y="239" class="node-sub">row.Error → failed</text><text x="420" y="251" class="node-tool">core · DBOS</text>
        <rect x="374" y="258" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="382" y="264" class="chip-text">DB</text>
        <rect x="450" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="458" y="264" class="chip-text">TB</text>

        <!-- POSTGRES · step rows (the durable read) -->
        <rect x="594" y="284" width="100" height="64" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <rect x="598" y="288" width="18" height="10" rx="3" fill="rgba(232,230,225,0.12)"/><text x="607" y="293" class="role-text">PG</text>
        <text x="644" y="307" class="node-title">step rows</text><text x="644" y="319" class="node-sub">status + step rows</text><text x="644" y="331" class="node-tool">DBOS · Postgres 18</text>
        <rect x="674" y="338" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="682" y="344" class="chip-text">DB</text>

        <!-- WEB · ExecutedPathToSVG (focal — receives the durable steps) -->
        <rect x="594" y="124" width="100" height="64" rx="6" fill="rgba(255,145,66,0.12)" stroke="#ff9142" stroke-width="1.2"/>
        <rect x="598" y="128" width="18" height="10" rx="3" fill="rgba(255,145,66,0.22)"/><text x="607" y="133" class="role-text focal-text">WEB</text>
        <text x="644" y="147" class="node-title">ExecutedPathToSVG</text><text x="644" y="159" class="node-sub">chain · state · 1.25×</text><text x="644" y="171" class="node-tool">web/graph</text>
        <rect x="598" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="606" y="184" class="chip-text">TB</text>
        <rect x="674" y="178" width="16" height="8" rx="3" fill="#9c6b50"/><text x="682" y="184" class="chip-text">FL</text>

        <!-- BROWSER · steps fragment (the HTMX swap) -->
        <rect x="594" y="44" width="100" height="64" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <rect x="598" y="48" width="18" height="10" rx="3" fill="rgba(232,230,225,0.12)"/><text x="607" y="53" class="role-text">HTMX</text>
        <text x="644" y="67" class="node-title">steps fragment</text><text x="644" y="79" class="node-sub">steps.html · every 2s</text><text x="644" y="91" class="node-tool">HTMX · swap</text>
        <rect x="598" y="98" width="16" height="8" rx="3" fill="#9c6b50"/><text x="606" y="104" class="chip-text">FL</text>

        <!-- Legend: steps -->
        <text x="164" y="372" class="legend-label">STEPS</text>
        <rect x="180" y="364" width="24" height="12" rx="6" fill="rgba(232,230,225,0.12)"/><text x="192" y="372" class="step-number">01</text><text x="212" y="372" class="legend-text">Request</text>
        <rect x="272" y="364" width="24" height="12" rx="6" fill="rgba(232,230,225,0.12)"/><text x="284" y="372" class="step-number">02</text><text x="304" y="372" class="legend-text">Fetch</text>
        <rect x="360" y="364" width="24" height="12" rx="6" fill="rgba(232,230,225,0.12)"/><text x="372" y="372" class="step-number">03</text><text x="392" y="372" class="legend-text">Read</text>
        <rect x="468" y="364" width="24" height="12" rx="6" fill="rgba(232,230,225,0.12)"/><text x="480" y="372" class="step-number">04</text><text x="500" y="372" class="legend-text">Rows</text>
        <rect x="568" y="364" width="24" height="12" rx="6" fill="rgba(255,145,66,0.22)"/><text x="580" y="372" class="step-number focal-text">05</text><text x="600" y="372" class="legend-text focal-text">Render</text>

        <!-- Legend: data types -->
        <text x="164" y="393" class="legend-label">DATA TYPE</text>
        <rect x="180" y="385" width="16" height="8" rx="3" fill="#6e6479"/><text x="188" y="391" class="chip-text">WB</text><text x="202" y="393" class="legend-text">Request</text>
        <rect x="252" y="385" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="260" y="391" class="chip-text">DB</text><text x="274" y="393" class="legend-text">Step rows</text>
        <rect x="332" y="385" width="16" height="8" rx="3" fill="#b8915a"/><text x="340" y="391" class="chip-text">TB</text><text x="354" y="393" class="legend-text">[]core.Step</text>
        <rect x="412" y="385" width="16" height="8" rx="3" fill="#9c6b50"/><text x="420" y="391" class="chip-text">FL</text><text x="434" y="393" class="legend-text">SVG</text>
        <text x="468" y="393" class="legend-text">left chip = input · right chip = output</text>

        <!-- Legend: flow -->
        <text x="164" y="415" class="legend-label">FLOW</text>
        <line x1="180" y1="412" x2="204" y2="412" stroke="#b8bcc4" marker-end="url(#arr-muted)"/><text x="212" y="415" class="legend-text">Hand-off</text>
        <line x1="324" y1="412" x2="348" y2="412" stroke="#ff9142" stroke-width="1.2" marker-end="url(#arr-accent)"/><text x="356" y="415" class="legend-text">Focal · durable steps</text>
        <line x1="460" y1="412" x2="484" y2="412" stroke="#7cc0ff" marker-end="url(#arr-link)"/><text x="492" y="415" class="legend-text">HTTP · SVG (browser)</text>
      </svg>
    </div>

    <footer>FlowDeck · diagram-design · 2026-07-09</footer>
  </div>
</body>
</html>
