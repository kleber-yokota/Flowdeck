<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executed path (improve) — dependency generation</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/executed-path-dependencies-improve.css">
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · FlowDeck · /executions/{id} · improve</p>
    <h1>Executed path (improve) — dependency generation</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 640 764" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="epimp-title epimp-desc">
        <title id="epimp-title">Executed path (improve) — dependency generation</title>
        <desc id="epimp-desc">Improved executed-path generation (Postgres only, app-version safe): the read fetches the step rows (operation_outputs — written when a step completes: Name · State (error → failed) · ChildID · started/completed times) and the child workflows (workflow_status by parent_workflow_id: name · status · attempts · queue); the decision ChildWorkflowID != '' splits child steps (the child name and badge are shown on the step) from plain steps; the step kind comes from the SDK-internal row name (DBOS.enqueue · getResult · select · recv · sleep — stable across app versions, unlike the boot AST, which is only valid for the current application_version); async Go steps have no Postgres flag (identifiable only via the boot AST, and only when the execution's application_version matches); there is no step-level running state — rows appear as steps complete, running is the workflow status PENDING (the badge); the wiring, the single root and the shared layout are unchanged.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="11" cy="11" r="0.8" fill="rgba(232,230,225,0.10)"/>
          </pattern>
          <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#b8bcc4"/></marker>
        </defs>

        <rect width="640" height="764" fill="#0b0c0e"/>
        <rect width="640" height="764" fill="url(#dots)"/>

        <!-- Connectors first (straight lines; one r=8 elbow where the YES branch rejoins). -->
        <path d="M 320 92 V 140" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <path d="M 320 196 V 252" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <path d="M 428 296 H 460" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <path d="M 320 340 V 492" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <path d="M 540 324 V 512 Q 540 520 532 520 H 480" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <path d="M 320 548 V 584" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>
        <path d="M 320 640 V 680" fill="none" stroke="#b8bcc4" marker-end="url(#arr-muted)"/>

        <!-- START · the Postgres read (improved: child workflows included) -->
        <text x="440" y="28" class="delta-tag" text-anchor="end">CHANGED</text>
        <ellipse cx="320" cy="64" rx="120" ry="28" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <text x="320" y="58" class="node-title">Postgres</text>
        <text x="320" y="72" class="node-sub">step rows + child rows · step_id asc</text>

        <!-- Process · the mapping keeps the dropped fields + the kind from the row name -->
        <text x="460" y="136" class="delta-tag" text-anchor="end">CHANGED</text>
        <rect x="180" y="140" width="280" height="56" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <text x="320" y="162" class="node-title">core.Steps — map each row</text>
        <text x="320" y="178" class="node-sub">Name · State · ChildID · times · kind (row name)</text>

        <!-- Decision · the new check: did the step spawn a child workflow? -->
        <polygon points="320,252 428,296 320,340 212,296" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <text x="320" y="300" class="diamond-text">ChildWorkflowID != ''?</text>
        <text x="320" y="316" class="delta-tag">NEW</text>
        <rect x="436" y="280" width="20" height="12" rx="2" fill="#0b0c0e"/>
        <text x="446" y="289" class="branch-label">YES</text>
        <rect x="324" y="364" width="20" height="12" rx="2" fill="#0b0c0e"/>
        <text x="334" y="373" class="branch-label">NO</text>

        <!-- NEW · the child workflows (workflow_status by parent_workflow_id) -->
        <text x="620" y="264" class="delta-tag" text-anchor="end">NEW</text>
        <rect x="460" y="268" width="160" height="56" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <text x="540" y="292" class="node-title">child workflows</text>
        <text x="540" y="308" class="node-sub">name · status · attempts · queue</text>

        <!-- Focal · the dependency wiring (unchanged), rendering gains the child name -->
        <text x="480" y="488" class="delta-tag" text-anchor="end">CHANGED</text>
        <rect x="160" y="492" width="320" height="56" rx="6" fill="rgba(255,145,66,0.10)" stroke="#ff9142" stroke-width="1.2"/>
        <text x="320" y="514" class="node-title">ExecutedPathToSVG — wire the dependency</text>
        <text x="320" y="530" class="node-sub">nodes[i-1] → nodes[i] · child name + badge</text>

        <!-- Process · single root + shared layout (unchanged) -->
        <rect x="170" y="584" width="300" height="56" rx="6" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <text x="320" y="608" class="node-title">single root · shared layout</text>
        <text x="320" y="624" class="node-sub">measure → place → collect · 1.25×</text>

        <!-- END · the linear SVG (improved content) -->
        <text x="450" y="676" class="delta-tag" text-anchor="end">CHANGED</text>
        <ellipse cx="320" cy="708" rx="130" ry="28" fill="rgba(232,230,225,0.04)" stroke="rgba(232,230,225,0.20)"/>
        <text x="320" y="702" class="node-title">executed path SVG</text>
        <text x="320" y="716" class="node-sub">state · child name per step</text>

        <!-- Notes · the running-state and the version-safety answers -->
        <text x="320" y="744" class="note">no step-level running: rows appear as steps complete · running = workflow status PENDING (the badge)</text>
        <text x="320" y="756" class="note">kind from the row name (DBOS.enqueue · getResult · select · recv · sleep) · async Go: no flag (AST only if app version matches)</text>
      </svg>
    </div>

    <footer>FlowDeck · diagram-design · improve · 2026-07-09</footer>
  </div>
</body>
</html>
