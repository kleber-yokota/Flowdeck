<body>
  <div class="frame">
    <p class="eyebrow">Sequence · FlowDeck · improve · /executions/{id}</p>
    <h1>Improve — Cancel a run (CancelWorkflow)</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc-title sc-desc">
        <title id="sc-title">Improve — Cancel a run (CancelWorkflow)</title>
        <desc id="sc-desc">Proposed cancel: the user clicks Cancel on the execution page (guard: state queued/running, anything else is a 400); the web POSTs to /cancel/{id} and the core calls dbos.CancelWorkflow, which sets workflow_status.status to CANCELLED and removes the run from the queue — the running step is not interrupted (it completes and is recorded) and the workflow stops at the start of the next step — and the ACK renders the cancelled badge (terminal, the poll stops); on the 2s poll the core's mapState now maps CANCELLED to the new cancelled state (it used to map to failed) and renders the new fifth badge — steel #8f96a3: cancelled is the operator's explicit stop, failed is the process's error.</desc>

          <marker id="sc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#b8bcc4"/>
          </marker>
          <marker id="sc-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#ff9142"/>
          </marker>
          <marker id="sc-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#7cc0ff"/>
          </marker>
          <linearGradient id="sc-steel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e2e4e8"/>
            <stop offset="0.45" stop-color="#8d939e"/>
            <stop offset="1" stop-color="#b7bcc4"/>
          </linearGradient>
          <linearGradient id="sc-panel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#191a1f"/>
            <stop offset="1" stop-color="#101114"/>
          </linearGradient>
        </defs>

        <line x1="800" y1="124" x2="800" y2="630" stroke="rgba(232,230,225,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- notes: cancel semantics (SDK facts) -->
        <text x="616" y="304" fill="#8f96a3" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">status = CANCELLED + out of the queue</text>

        <text x="616" y="550" fill="#8f96a3" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">new fifth badge · #8f96a3 (steel) — the explicit decision</text>
