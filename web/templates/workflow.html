<!DOCTYPE html>
<html lang="en">
<head>
  {{template "head.html" .}}
</head>
<body>
  <main class="frame wide">
    <p class="eyebrow"><a class="back" href="/">Workflows</a></p>
    <h1>{{ .Name }}</h1>
    {{if .Spec}}
    <!-- Phase 5, DISPLAY: the parameter form on top — the workflow's
         input (editable) and the steps' default values (the literals of
         the source, read-only), from the spec the core parsed at boot. -->
    <form class="params"
          hx-post="/run/{{ .Name | urlquery }}"
          hx-target="#executions"
          hx-swap="afterbegin">
      <label>
        {{ .Spec.Input.Name }}
        <input type="text" name="{{ .Spec.Input.Name }}" />
      </label>
      <button type="submit" class="run">Run</button>
    </form>
    <ul class="step-defaults">
      {{range .Spec.Steps}}{{if .Default}}<li><span class="step-name">{{ .Name }}</span> <code>{{ .Default }}</code></li>{{end}}{{end}}
    </ul>
    {{else}}
    <button type="button"
            class="run"
            hx-post="/run/{{ .Name | urlquery }}"
            hx-target="#executions"
            hx-swap="afterbegin">
      Run
    </button>
    {{end}}
    <div class="columns">
      <!-- Left: what was executed — the runs of this workflow, newest first
           (phase 3, LIST). Each row links to the execution detail; the badge
           polls GET /status every 2s until the run reaches a terminal state.
           Each dispatch enqueues a run in the core (DBOS queue) and prepends
           a row (the ACK). -->
      <section class="col">
        <p class="col-label">Executions</p>
        <ul id="executions" class="executions">
{{range .Executions}}
{{template "execution.html" .}}
{{end}}
        </ul>
      </section>
      <!-- Right: the generated graph (phase 4, STEP 2, overview) — every
           possible path of the workflow, from the boot map (map lookup, no
           re-parse, no DB): steps are nodes and the if forks the branches. -->
      <section class="col">
        <p class="col-label">Paths</p>
        <div class="graph">{{.Graph}}</div>
      </section>
    </div>
  </main>
</body>
</html>
