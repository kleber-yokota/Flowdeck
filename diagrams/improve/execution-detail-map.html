        <desc id="em-desc">Execution lifecycle for /executions/{id} (improve): the fifth badge, cancelled (steel #8f96a3 — an existing color, so no new color is proposed), joins queued, running, success and failed. Cancel (guard: live) reaches cancelled from queued or running (done — see sequence-cancel). The improved resume re-queues a run from failed via dbos.RewindWorkflow with the cut at the first failed step (bug.md — the SDK ResumeWorkflow is a no-op on ERROR rows) and from cancelled via dbos.ResumeWorkflow; both return enqueued, the badge goes back to queued and the 2s poll resumes. Terminal = polling stops and the badge dot. The executed-path graph labels child steps with the child workflow name (the child's own workflow_status.name) plus a live badge. The ledger maps every improvement to its file and function.</desc>
